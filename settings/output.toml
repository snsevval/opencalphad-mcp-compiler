## =====================================================================
## output.toml -- how a result is assembled and stated.
##
## INVARIANT FOR THIS FILE
##     Nothing here may change a physical result. Units and presentation
##     only. If a setting in this file alters a number's meaning, it is
##     in the wrong file.
##
##     Testable, and tested: permute every setting here, and the physics
##     must come back byte for byte identical.
##
##     Because of that invariant, this file can be reviewed safely. A
##     reader can go through it knowing that nothing they find can break
##     a calculation. input.toml carries the opposite guarantee.
##
## Two exceptions are written down rather than assumed, at the bottom:
## rounding and basis conversion both touch numbers, and both are allowed
## only under conditions this file states.
## Anything without a `status` line is live today. `status = "planned"`
## marks a setting that is designed and not yet wired -- it is here so the
## design stays in one place, and marked so the file never claims the
## system does something it does not.
##
## =====================================================================

## Her bolumun bir `status` alani olabilir. Uc deger, uc ayri anlam:
##
##   yok         kod bunu okuyor, calisiyor
##   "code"      asla tasinmayacak -- burada BELGE, karar kodun
##   "todo"      tasinabilir, henuz yapilmadi
##   "planned"   tasima degil, once yazilmasi gereken YENI IS
##
## Ayrimin sebebi: bunlar olmadan bir bolumun okunmuyor olmasi, unutulmus
## mu yoksa kasitli mi oldugunu soylemiyor. `settings_audit.py` de bu
## alandan okuyor -- elle tutulan bir "bunlar sessiz olmali" listesi yok.

schema_version = 1


## ---------------------------------------------------------------------
## REPORT -- units and representation
## ---------------------------------------------------------------------

[report]
status = "todo"
status_because = """
None of these flags is implemented. Results always carry backend_used,
verification and the chemical potentials; energy is always J/mol and
nothing converts. Turning them into real switches is work that has not
been done, not work that was decided against."""
energy_unit          = "J/mol"
include_backend_used = true
include_verification = true
include_potentials   = true

# Nothing rounds today: values come back as full floats
# (gibbs_energy_J = -62632.0305776248). Written down as designed rather
# than asserted as done -- see [conversion.rounding], which depends on it.
[report.precision]
status = "planned"
digits = 6

[report.basis]
status = "planned"
mode = "as_computed"
label_per_point = true
because = """
NOT YET WIRED. Today a scan point carries `source` (which engine produced
it) but no `basis` field, and a single-point result carries neither. The
basis is knowable from the source and is not stated.

The mirror of input.toml's basis problem, and the one that actually bit us.
Native STEP reports phase MASS fractions; the single-point path reports
MOLAR amounts. A combined scan carries both. They once disagreed by 26 per
cent and the difference was read as a physical effect until it was traced.

Converting is allowed -- see [conversion] below -- but the basis of every
point is stated, never assumed."""


## ---------------------------------------------------------------------
## FLOOR -- what cannot be switched off
##
## The one place an output setting can do real damage: not by changing a
## number, but by removing what tells the reader how to read it.
## `include_verification = false` leaves every value intact and drops the
## flag saying a value is suspect.
## ---------------------------------------------------------------------

[floor]
status = "planned"
status_because = """
Two of the four fields it names do not exist yet: `basis` is on no result
and `source` only on scan points. Cannot be enforced before the fields it
protects are written -- see [report.basis]."""
always_present         = ["verification.passed", "backend_used"]
always_present_planned = ["basis", "source"]
because = """
These decide how a number should be read: whether it passed its checks,
which engine produced it, what it is a fraction of, and whether it came
from the line or from a gap-filled point. Removing them does not change a
result; it removes the reader's ability to judge one.

The first two hold today. `source` is present on scan points and absent
from single-point results; `basis` is absent everywhere. Both are listed
separately rather than claimed, because this file is read as a statement
of what the system does."""

[floor.raw_values]
status   = "planned"
retained = true
because = """
Rounding is presentation, but our own checks -- mass balance, fractions
summing to one -- must run on the unrounded values. The displayed number is
rounded; the verified number is not."""


## ---------------------------------------------------------------------
## DERIVE -- what is computed from a scan before handing it over
##
## These are the questions a scan is actually asked, and none of them is
## answerable from a single row.
## ---------------------------------------------------------------------

[derive]
enabled = [
  "phase_regions",
  "phase_transitions",
  "dominant_phase_regions",
  "melting_landmarks",
  "under_sampled",
]
presence_tolerance  = 1e-4
dominance_threshold = 0.5
because = """
Measured: seven of fourteen graded scan questions failed the same way. A
delta-ferrite field 24 K wide reported as absent; a dominance threshold at
x=0.19 reported as x=0.26; a phase dissolution at 660 K reported as 602 K.
In every case the evidence was in the payload and the comparison across
rows was not performed. Single-row reads, in the same answers, were exact.

So the comparison is done here, once, deterministically, at no engine cost.

presence_tolerance is 1e-4 because STEP and the single-point path disagree
in the fifth decimal on trace phases, and a 1e-6 sliver flickering in and
out would otherwise produce a transition at every other point.

dominance_threshold is 0.5 because that is the threshold the questions
themselves use -- "when does ferrite become dominant" -- not a modelling
choice of ours."""


## ---------------------------------------------------------------------
## HONESTY -- how a derived number is allowed to be stated
##
## Settings about language. They are settings, and not style, because
## getting them wrong produces a confident wrong answer rather than a
## visible error.
## ---------------------------------------------------------------------

[honesty]
status = "todo"
status_because = """
All six rules below are obeyed in the code today -- boundaries are
reported as brackets, single-point regions are flagged, a failing result
is returned rather than hidden, an absent review is not disapproval, no
point is invented, and the review advises rather than decides. None of
them is read from here.

Marked `todo` rather than `code` because they COULD be read. But note what
that would buy: making them switches makes them switchable off, and these
are invariants, not preferences. If they are wired it should be as
assertions the code checks itself against, not as flags."""

[honesty.boundaries_as_brackets]
enabled = true
because = """
A boundary lies between two sampled positions and is at neither of them.
Reported as one number it reads as a measurement; reported as the pair it
is one. Every boundary carries `boundary_between` and the width of that
interval."""

[honesty.flag_single_point_regions]
enabled = true
because = """
A phase field seen at one position only has an unknown extent. It exists,
and its width is not known, and both halves of that have to survive into
the answer -- which is what `under_sampled` is for. The failure it guards
against is real: a field seen once was reported as absent."""

[honesty.never_hide_flagged_results]
enabled = true
because = """
A result that fails a check is still returned, flagged rather than
replaced. The caller asked for a calculation and the engine produced one;
hiding it would remove the evidence needed to judge what went wrong."""

[honesty.review_is_advisory_not_a_verdict]
enabled = true
because = """
The independent review reports; it does not decide. Its objection is
recorded and framed as an objection, and it never flips a result to
failed.

It is a second model, and it is weak in exactly the place a model is weak:
it reaches for a remembered generality before it reads the numbers.
Measured -- steel1 Fe-1at%C at 1100 K returned 7.5% ferrite with 92.5%
austenite, which is correct five degrees below A3, and the reviewer called
it inconsistent with the Fe-C diagram because above the eutectoid it
expected austenite alone. The caller relayed that objection as settled,
disowned its own eight exact numbers, and told the user the real diagram
forbids what the engine had computed.

What it is good at is turning up things nobody was looking for: the
LIQUID/LIQUID#1 naming split and the alni-4slx convergence rate both came
from here. That is a lead, and a lead is worth having. It is not a
verdict, and presenting it as one costs more than it returns."""

[honesty.absent_review_is_not_disapproval]
enabled = true
because = """
An unreachable reviewer says nothing about the chemistry. Absence of an
opinion is never reported as a negative one -- the provider's capacity must
not turn into a false alarm about the user's alloy."""

[honesty.no_invented_points]
enabled = true
because = """
A position the engine could not solve is left out, never interpolated. A
gap in a scan is a fact about the calculation; filling it with a plausible
value would hide exactly the thing worth knowing."""


## ---------------------------------------------------------------------
## NOTES -- text that travels with the numbers
##
## Collected here because these are read as findings, and a sentence that
## can be read two ways becomes a wrong finding.
## ---------------------------------------------------------------------

[[note]]
id   = "phase-name-is-structure-not-composition"
when = "phase_dominant_element_differs_from_alloy"
text = """
In this phase the dominant element is {phase_major} ({phase_major_fraction} \
of this phase). The alloy as a whole is dominated by {alloy_major}. A phase \
name in this database denotes crystal structure, not composition -- the \
same name covers chemically different phases."""
because = """
The earlier wording put two different quantities in one sentence with a
single number between them, and could be read as stating the alloy's
composition when it was stating the phase's. Rewritten so each number sits
next to the thing it measures."""

[[note]]
id   = "independent-review-objected"
when = "layer_b_returned_false"
text = """
An independent model was asked to look at this result and objected: \
{reason}

This objection is NOT a finding. It was not checked against anything, and \
the reviewer is a language model reasoning from memory, not a second \
calculation. The result below passed its own structural checks. Treat the \
objection as a question worth asking, not as a correction -- and if you \
repeat it to the user, say which of the two it is."""
because = """
The framing is the whole point. Reported as a verdict, a wrong objection
propagates with authority: the caller abandoned eight correct numbers and
told the user the real phase diagram forbade them."""

[[note]]
id   = "gibbs-difference-is-not-a-ranking"
when = "compared_alloys_differ_in_elements"
text = """
These compositions do not contain the same elements, so this difference \
does NOT say which alloy is more stable -- each Gibbs energy is measured \
against a different set of reference states and the difference mostly \
reflects that. Stability compares states of one composition. To compare \
two alloys, use what does transfer: which phases each forms, how much of \
each, how close other phases are to appearing (driving_force_RT), or over \
what temperature range each stays single-phase."""
because = """
Handed over unframed once, and read as "alloy B is more stable than alloy
A" -- a comparison the number does not support. Measured: asked which of
Fe-20Cr and Fe-20Cr-2Mo is more stable at 1273 K, the caller read the field
correctly (-569 J) and concluded the molybdenum alloy was more stable. Both
are single-phase ferrite; neither is more stable than the other. It took
the framing the field name offered, and there was none anywhere else.

Swapping 2% Fe for 2% Mo moves G by the reference contribution of that
swap and says nothing about how favourable either alloy is."""


[[note]]
id   = "gibbs-difference-is-a-ranking"
when = "compared_alloys_share_elements"
text = """
Both sides have the same elements, so this difference is a like-for-like \
comparison: the lower Gibbs energy is the more stable state."""
because = """
The other half of the rule above, and it has to be said too. A caller told
only when the comparison is invalid will assume it is always invalid, and
the same-element case is exactly the one the number does answer."""

[[note]]
id   = "composition-was-rescaled"
when = "input_sum_far_from_one"
text = """
Note: composition amounts summed to {total}; they have been normalised. \
Double-check this is the intended composition."""
because = """
The counterpart to input.toml's `normalise_to_one`. Normalising is right;
doing it without saying so is not."""

[[note]]
id   = "mixed-basis-in-combined-scan"
when = "scan_has_mixed_sources"
text = """
Values from native STEP are phase mass fractions; positions its line did \
not reach come from single-point equilibrium calls converted to the same \
basis. See each point's 'source' field."""
because = "the two engines report in different bases and once disagreed by 26%"

[[note]]
id   = "scan-coverage-incomplete"
when = "solved_positions_below_requested"
minimum_covered_fraction = 0.9
text = """
{solved} of {requested} requested positions were solved; the scan covers \
{covered_range} of the range asked for. The rest did not converge."""
because = """
Found while checking a scan by hand: a twenty-position request came back
with one position, reported as verified and carrying no warning at all.
Every layer passed it, because one point is a perfectly well-formed result.
What was missing was not a check on the numbers but a count of the ones
that never arrived."""


## ---------------------------------------------------------------------
## STOP RULE -- what a caller should do with a refusal
##
## One rule, stated once. Today it is six hand-copied paragraphs in six
## docstrings, and correcting it meant editing all six by hand.
## ---------------------------------------------------------------------

## STOP RULE was here. It moved to input.toml, next to the reject, route
## and precondition rules its three keys answer.
##
## Measured, and the file's own invariant is what showed it: this section
## touches no number, so it looked at home here -- but it decides whether
## ANOTHER CALCULATION RUNS. Change on_no_route to "try something else" and
## the system computes a different thing. That is the input side's risk,
## not this file's.
##
## The code had it right before the settings did: stop_rule_block() sits in
## settings_engine above the "Output side" divider, among the functions
## that decide what runs.


## ---------------------------------------------------------------------
## CONVERSION -- the two places this file is allowed to touch numbers
##
## Written down rather than left as an exception, because an unstated
## exception to an invariant is how invariants stop being true.
## ---------------------------------------------------------------------

[conversion]
status_because = """
Read for [conversion.axis_position]; the other two sub-blocks carry their
own `planned` status and say what they are waiting on. Written out in full
because an unstated exception to an invariant is how invariants stop being
true -- output.toml claims it never touches a number, and these are the
places it eventually will. Adding a second basis alongside the first is
not touching one: the mole value stays exactly as the engine produced
it."""

[conversion.units]
status    = "planned"
allowed   = true
condition = "reversible"
because = """
J/mol to kJ/mol loses nothing and can be undone exactly. Permitted, because
the invariant is about content and this changes none."""

## Two conversions were written here as one, and only the second needs the
## phase compositions. Splitting them because the first is answerable today
## and was measured going wrong while it sat behind the second's condition.

[conversion.axis_position]
allowed   = true
condition = "overall_composition_recoverable"
because = """
An axis position is an OVERALL composition coordinate. Converting it needs
the overall composition at that point, and native_step.composition_at
reconstructs it exactly as the macro did -- so the alloy converted is the
alloy computed, not a nearby one. Reversible: the mole value stays, and the
base composition plus the dependent-element rule recover it.

Measured (1.29): a 25-point nickel scan came back with every axis position
named `x` and no unit on it, while composition_basis described the base
composition where nickel is still zero. The caller converted all 25 by hand
and every figure was low -- x(NI)=0.0333 is 3.55 weight per cent, reported
as 3.2 -- and then advised 2-3 wt% for full austenite where 3.55 was
needed. Nobody was careless; the number had no unit attached, which is the
same failure 1.10 had and the same fix."""

[conversion.phase_amounts]
status    = "planned"
allowed   = true
condition = "phase_compositions_also_reported"
because = """
Converting a phase's MOLAR AMOUNT to a mass fraction is different
arithmetic: it needs that phase's own composition, and the payload carries
phase_molar_amounts only. Without those the conversion is one-way and the
original content cannot be recovered -- which would make it a change of
content, not of presentation, and it would belong in input.toml
instead."""

[conversion.rounding]
status    = "planned"
allowed   = true
condition = "raw_retained"
because = """
Rounding destroys information. Permitted for display because the unrounded
value stays in the result and is what our own checks run against. See
[floor.raw_values]."""

## ---------------------------------------------------------------------
## VERIFY -- what is checked once the engine has answered
##
## Layer A. These do not decide what to compute or how to say it: they
## decide whether the result may be CLAIMED CORRECT. That is a fourth kind
## of risk, and it lives here because it is the only side that looks at
## what came out.
##
## The predicates stay in result_check.py, exactly as input.toml's checks
## stay in settings_engine -- the arithmetic is code. What moved is the
## declaration: which checks run, at which stage, with which threshold,
## and why each one exists.
##
## No enable flags. A check listed here MUST run; the compiler binds every
## name at startup and refuses to start on one it cannot resolve. That is
## the point of writing them down: eight checks were called from a
## hand-written sequence, and if one had dropped out of that sequence
## nothing would have noticed -- which is precisely what happened in
## preflight.py, where nine rules sat uncalled for months.
##
## `stage` picks the entry point:
##   result          is this a well-formed thermodynamic result
##   correspondence  is it a result for the question that was asked
## ---------------------------------------------------------------------

[[verify]]
id    = "phase-fraction-sums"
name  = "phase_fractions"
stage = "result"
check = "phase_fraction_sums"
tolerance = 1e-3
because = """
Fractions that do not sum to one are not a result at all. Applied wherever
phase_molar_amounts appears -- a single point, or every point of a scan --
and to NaN and out-of-range values with it. Points carrying their own
error are skipped rather than reported twice.

1e-3 because STEP and the single-point path disagree in the fourth decimal
on a converged answer, and a tighter bound would flag arithmetic that is
correct."""

[[verify]]
id    = "failed-points"
name  = "failed_points"
stage = "result"
check = "failed_points"
max_failed_fraction = 0.10
because = """
Of the points that came back, how many carry an error. A scan with a
scattering of unsolved points is still usable; one where a tenth of them
failed is a different object and should say so.

Not the same question as scan coverage, which asks how many positions never
came back at all -- both were once called `coverage`, and on iron4cd this
one passed with two points neither in error while the other warned at two
of twenty requested."""

[[verify]]
id    = "requested-elements"
name  = "elements"
stage = "correspondence"
check = "requested_elements"
because = """
Every element asked for is present, and no element that was not asked for
appeared. Measured with PREFLIGHT disabled: a request for Fe-0.1Ni came
back as pure iron, structurally flawless, because the native macro silently
dropped the element it could not write. PREFLIGHT catches an element that
is not in the database; only this catches one that IS in the database and
never reached the calculation."""

[[verify]]
id    = "mass-balance"
name  = "mass_balance"
stage = "correspondence"
check = "mass_balance"
tolerance = 2e-4
because = """
Each element's amount in the result matches what was requested. A macro
that writes the conditions in the wrong order, or drops one, produces a
converged answer for a different alloy.

2e-4 is the spread the engine's own reporting shows on a correct
conditioning; below that the check fires on rounding."""

[[verify]]
id    = "suspended-phases-absent"
name  = "suspended_phases"
stage = "correspondence"
check = "suspended_phases_absent"
because = """
A phase the caller suspended must genuinely be absent from the result.
Suspension is honoured only on the OCASI path; if a request falls to a tier
that cannot express it, the answer comes back as though nothing was
suspended and looks entirely normal."""

[[verify]]
id    = "requested-positions"
name  = "requested_positions"
stage = "correspondence"
check = "requested_positions"
minimum_covered = 0.9
because = """
How much of the requested scan actually came back. Measured on iron4cd: a
twenty-point nickel scan returned two points, and the payload said
"verified" because both of them were sound. Two points are not a scan of
the range that was asked for.

0.9 rather than 1.0 because a line may legitimately stop short at a phase
boundary; below nine tenths it is a different question being answered."""

[[verify]]
id    = "reported-conditions"
name  = "conditions"
stage = "correspondence"
check = "reported_conditions"
reports_availability = true
because = """
The engine prints the conditions it actually used; this reads them back and
compares. Measured on iron4cd: a database that warns on load leaves the
engine waiting for RETURN, the macro's condition line answers that prompt
instead, and the calculation runs with no conditions at all -- degrees of
freedom 6, G = 0.0. The request was flawless, so nothing upstream could
have caught it.

Reports availability because OCASI is called through function arguments and
prints no such account. An absent check is recorded as unavailable, never
as passed."""

[[verify]]
id    = "degrees-of-freedom"
name  = "degrees_of_freedom"
stage = "correspondence"
check = "degrees_of_freedom"
reports_availability = true
because = """
A fully conditioned equilibrium has zero degrees of freedom. Anything else
means the engine solved a less constrained problem than the one described,
and the number it returns is for that problem. Same origin as the check
above, and the same availability caveat."""
